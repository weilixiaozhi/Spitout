name: spitout
description: "Spitout - 个人记账应用"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.2
  # sqlite3 原为 drift 传递依赖：本地备份的完整性校验需以只读模式直接调其
  # PRAGMA API（drift 裸 executor 的 ensureOpen 依赖内部接口不可用），提升为
  # 显式直接依赖；版本仍由 pubspec.lock 固定，未引入任何新版本。
  sqlite3: ^2.9.4
  # 无 Dart API，仅用于打包原生 SQLite 二进制供 Drift FFI 加载，零 import 属正常，勿删。
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  # 【禁止升级到 0.20.x】本项目通过 FVM 锁定 Flutter 3.27.0（见 .fvmrc / .fvm/fvm_config.json），
  # 该版本 flutter_localizations 将 intl 钉死在 0.19.0，升到 ^0.20.2 会导致版本求解失败、无法构建。
  # 如果你在终端跑 `flutter pub get` 时看到 "intl is pinned to 0.20.2" 的报错，
  # 说明你误用了 PATH 里的全局 Flutter 3.44.6，而不是项目约束过期——
  # 正确做法是改用 `fvm flutter pub get`（等价于 .fvm/versions/3.27.0/bin/flutter），
  # 千万不要通过升级 intl 来"修复"该报错。pubspec.lock 也必须用 fvm 重新生成。
  intl: ^0.19.0
  decimal: ^3.0.0
  fl_chart: ^0.68.0
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.1.0
  csv: ^5.0.2
  file_picker: ^8.1.2
  supabase_flutter: ^2.5.6
  crypto: ^3.0.5
  uuid: ^4.5.1
  flutter_svg: ^2.0.10+1
  # Lucide 图标库（ISC 许可免署名）：全站 UI 图标与分类图标的统一来源，
  # 单色描边字形，用法与 Material Icons 一致（Icon(LucideIcons.x, color:)）。
  lucide_icons: ^0.257.0
  package_info_plus: ^8.0.2
  http: ^1.2.2
  share_plus: ^12.0.1
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_list_view: ^1.1.29
  visibility_detector: ^0.4.0+2
  reorderable_grid_view: ^2.2.8
  excel: ^4.0.6
  image_picker: ^1.1.2
  gbk_codec: ^0.4.0
  yaml: ^3.1.2
  flutter_cloud_sync:
    path: packages/flutter_cloud_sync
  flutter_cloud_sync_supabase:
    path: packages/flutter_cloud_sync_supabase
  flutter_cloud_sync_webdav:
    path: packages/flutter_cloud_sync_webdav
  flutter_cloud_sync_s3:
    path: packages/flutter_cloud_sync_s3
  flutter_cloud_sync_spitout_cloud:
    path: packages/flutter_cloud_sync_spitout_cloud
  table_calendar: ^3.1.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.10
  drift_dev: ^2.20.2

  # Testing framework enhancements
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/ic_launcher_spitout.svg
  # 字体已移动到可选依赖，使用系统字体以减少应用体积
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: NotoSansSC
  #     fonts:
  #       - asset: assets/fonts/NotoSansSC-Regular.ttf
  #       - asset: assets/fonts/NotoSansSC-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansSC-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NotoSansSC-Bold.ttf
  #         weight: 700

# 重新生成应用启动图标（修改 pubspec 的 flutter_launcher_icons 配置后执行）
#   flutter pub run flutter_launcher_icons
# 说明：flutter_launcher_icons 仅支持位图，源 SVG 需先栅格化：
#   flutter test scripts/launcher_icons/rasterize_svg.dart
flutter_launcher_icons:
  android: true
  image_path: assets/flutter_launcher_icons/launcher_legacy.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/flutter_launcher_icons/adaptive_foreground.png
  # 13% 内缩使图形实际占比降至 ~49.4%，充分落入 Android 66dp 安全圆区（66/108≈61.1%）
  adaptive_icon_foreground_inset: 13
  adaptive_icon_monochrome: assets/flutter_launcher_icons/adaptive_monochrome.png
  adaptive_icon_monochrome_inset: 13
