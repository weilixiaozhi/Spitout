name: flutter_cloud_sync_spitout_cloud
description: Spitout Cloud provider for flutter_cloud_sync
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_cloud_sync:
    path: ../flutter_cloud_sync
  # Spitout Cloud 私有协议依赖（原核心包 5 寄生依赖随 provider 一并迁出）
  crypto: ^3.0.3
  # 13 系列要求 win32 ^6，与 file_picker 11.x 冲突，暂保持 12.x
  device_info_plus: ^12.0.0
  # 会话 token 默认落系统安全存储(Keychain / Keystore),禁止明文写 SharedPreferences。
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  package_info_plus: ^9.0.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  # This package is a pure Dart package
