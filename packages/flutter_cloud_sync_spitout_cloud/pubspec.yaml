name: flutter_cloud_sync_spitout_cloud
description: Spitout Cloud provider for flutter_cloud_sync
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_cloud_sync:
    path: ../flutter_cloud_sync
  # Spitout Cloud 私有协议依赖（原核心包 5 寄生依赖随 provider 一并迁出）
  crypto: ^3.0.3
  device_info_plus: ^11.1.0
  http: ^1.2.2
  package_info_plus: ^8.1.2
  shared_preferences: ^2.2.2
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  # This package is a pure Dart package
